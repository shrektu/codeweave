appId: dev.codeweave.app
productName: Codeweave
directories:
  output: release
npmRebuild: false
icon: build/icon.png
generateUpdatesFilesForAllChannels: true
publish:
  provider: github
  owner: shrektu
  repo: codeweave
  releaseType: draft
files:
  - out/**
  - package.json
  - "!node_modules/node-pty/{src,deps,scripts,third_party}/**"
  - "!node_modules/node-pty/build/Release/conpty/**"
  - "!node_modules/node-pty/prebuilds/**"
  - "node_modules/node-pty/prebuilds/${platform}-${arch}/**"
  - "!node_modules/@anthropic-ai/claude-agent-sdk-*/**"
  - "node_modules/@anthropic-ai/claude-agent-sdk-${platform}-${arch}/**"
  - "!node_modules/@koromix/koffi-*/**"
  - "node_modules/@koromix/koffi-${platform}-${arch}/**"
asarUnpack:
  - out/main/agyHook*.js
  - out/main/chunks/**
  - node_modules/shell-quote/**
  - node_modules/@agentclientprotocol/claude-agent-acp/**
  - node_modules/@agentclientprotocol/sdk/**
  - node_modules/@anthropic-ai/claude-agent-sdk-darwin-arm64/**
  - node_modules/@anthropic-ai/claude-agent-sdk-darwin-x64/**
  - node_modules/@anthropic-ai/claude-agent-sdk-linux-arm64-musl/**
  - node_modules/@anthropic-ai/claude-agent-sdk-linux-arm64/**
  - node_modules/@anthropic-ai/claude-agent-sdk-linux-x64-musl/**
  - node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/**
  - node_modules/@anthropic-ai/claude-agent-sdk-win32-arm64/**
  - node_modules/@anthropic-ai/claude-agent-sdk-win32-x64/**
  - node_modules/@anthropic-ai/claude-agent-sdk/**
  - node_modules/@koromix/koffi-darwin-arm64/**
  - node_modules/@koromix/koffi-darwin-x64/**
  - node_modules/@koromix/koffi-linux-arm64/**
  - node_modules/@koromix/koffi-linux-x64/**
  - node_modules/@koromix/koffi-win32-arm64/**
  - node_modules/@koromix/koffi-win32-x64/**
  - node_modules/diff/**
  - node_modules/koffi/**
  - node_modules/node-pty/**
  - node_modules/zod/**
linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Development
  maintainer: Codeweave <shrektu@users.noreply.github.com>
  synopsis: Desktop workspace for orchestrating coding agents
  syncDesktopName: true
  icon: build/icons
  extraResources:
    - from: build/icons/512x512.png
      to: icon.png
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  artifactName: "${productName}-Setup-${version}.${ext}"
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: "${productName}-${version}-${arch}.${ext}"
