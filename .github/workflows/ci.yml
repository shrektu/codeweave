name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enable systemd user session (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          runtime_dir="/run/user/$(id -u)"
          for _ in $(seq 1 30); do
            [ -S "$runtime_dir/bus" ] && break
            sleep 1
          done
          test -S "$runtime_dir/bus"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime_dir/bus" >> "$GITHUB_ENV"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm run pack
      - name: Packed app terminal test (Linux)
        if: runner.os == 'Linux'
        env:
          CODEWEAVE_E2E_EXECUTABLE: ${{ github.workspace }}/release/linux-unpacked/codeweave
        run: xvfb-run --auto-servernum pnpm exec playwright test tests/e2e/terminal.spec.ts
      - name: Packed app terminal test (Windows)
        if: runner.os == 'Windows'
        env:
          CODEWEAVE_E2E_EXECUTABLE: ${{ github.workspace }}\release\win-unpacked\Codeweave.exe
        run: pnpm exec playwright test tests/e2e/terminal.spec.ts
      - name: Packed app terminal test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_dir="$(ls -d release/mac*/Codeweave.app | head -n 1)"
          CODEWEAVE_E2E_EXECUTABLE="$PWD/$app_dir/Contents/MacOS/Codeweave" \
            pnpm exec playwright test tests/e2e/terminal.spec.ts
      - name: End-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm e2e
      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: pnpm e2e
      - name: Install Claude Code CLI (Linux)
        if: runner.os == 'Linux'
        run: npm i -g @anthropic-ai/claude-code@2.1.312
      - name: Install Codex CLI (Linux)
        if: runner.os == 'Linux'
        run: npm i -g @openai/codex@0.165.0
      - name: Install OpenCode CLI (Linux)
        if: runner.os == 'Linux'
        run: npm i -g opencode-ai@1.19.5
      - name: Install keyring (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring
      - name: Install Antigravity CLI (Linux)
        if: runner.os == 'Linux'
        run: |
          archive="$RUNNER_TEMP/cli_linux_x64.tar.gz"
          extract_dir="$RUNNER_TEMP/antigravity-cli"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://storage.googleapis.com/antigravity-public/antigravity-cli/1.4.11-5180209989812224/linux-x64/cli_linux_x64.tar.gz"
          echo "2935601efa745ed6e314d32b415c71f44d9d455f0e6a2583372584be5a9074c28154cf81d5eec65b4416579453a3b3b05d3abe4d4f176754d5ef93a84af6cf28  $archive" | sha512sum -c -
          mkdir -p "$extract_dir" "$RUNNER_TEMP/agy-bin"
          tar -xzf "$archive" -C "$extract_dir"
          install -m 0555 "$extract_dir/antigravity" "$RUNNER_TEMP/agy-bin/agy"
          chmod 0555 "$RUNNER_TEMP/agy-bin"
          echo "$RUNNER_TEMP/agy-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/agy-bin/agy" --version
      - name: Rotation end-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: |
          openssl rand -hex 16 | tr -d '\n' | gnome-keyring-daemon --unlock --components=secrets
          xvfb-run --auto-servernum pnpm e2e:rotation
