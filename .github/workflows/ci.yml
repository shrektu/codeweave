name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enable systemd user session (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          runtime_dir="/run/user/$(id -u)"
          for _ in $(seq 1 30); do
            [ -S "$runtime_dir/bus" ] && break
            sleep 1
          done
          test -S "$runtime_dir/bus"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime_dir/bus" >> "$GITHUB_ENV"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm run pack
      - name: End-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm e2e
      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: pnpm e2e
      - name: Install Claude Code CLI (Linux)
        if: runner.os == 'Linux'
        run: npm i -g @anthropic-ai/claude-code@2.1.312
      - name: Install Codex CLI (Linux)
        if: runner.os == 'Linux'
        run: npm i -g @openai/codex@0.165.0
      - name: Install OpenCode CLI (Linux)
        if: runner.os == 'Linux'
        run: npm i -g opencode-ai@1.19.5
      - name: Install keyring (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring
      - name: Rotation end-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: |
          openssl rand -hex 16 | tr -d '\n' | gnome-keyring-daemon --unlock --components=secrets
          xvfb-run --auto-servernum pnpm e2e:rotation
